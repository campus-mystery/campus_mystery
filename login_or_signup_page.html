<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Sign In</title>
    
    <!-- Loading Tailwind CSS for responsive design and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Loading Google Font for the bold cursive handwriting text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Cursive font class */
        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Initial load fade-in animation for the entire page */
        .fade-in-load {
            animation: fadeInLoad 1.2s ease-out forwards;
        }

        @keyframes fadeInLoad {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Transition class for toggling specific text states smoothly */
        .state-transition {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-white text-black min-h-screen flex items-center justify-center font-sans antialiased fade-in-load">

    <main class="w-full max-w-sm px-6">
        
        <!-- Wrapper that handles layout -->
        <div id="content-wrapper" class="flex flex-col items-center w-full">
            
            <!-- Big, very bold cursive heading -->
            <h1 id="main-heading" class="font-cursive text-7xl font-bold tracking-wide mb-6 text-center uppercase state-transition opacity-100">SIGN UP</h1>
            
            <!-- Dynamic Error Message Banner -->
            <div id="error-message" class="hidden w-full mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-xs font-semibold rounded-2xl text-center"></div>

            <!-- Auth Form with dynamic action attribute -->
            <form id="auth-form" action="/api/signup" method="POST" class="w-full flex flex-col items-center">
                
                <!-- Div container block with thin black border and rounded corners -->
                <div class="w-full border border-black rounded-3xl p-6 flex flex-col gap-5 shadow-sm bg-white">
                    
                    <!-- Input boxes with rounded border radii -->
                    <div class="flex flex-col gap-1.5">
                        <label for="email" class="text-xs font-bold uppercase tracking-wider text-gray-800 pl-1">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required
                               class="w-full px-4 py-3 rounded-2xl border border-gray-300 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors bg-white">
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label for="password" class="text-xs font-bold uppercase tracking-wider text-gray-800 pl-1">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                               class="w-full px-4 py-3 rounded-2xl border border-gray-300 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors bg-white">
                    </div>
                </div>
                
                <!-- Button outside the div container -->
                <button type="submit" id="submit-btn" 
                        class="w-full mt-8 bg-black text-white font-bold text-lg py-4 rounded-3xl hover:bg-gray-800 active:scale-[0.98] transition-all shadow-md state-transition opacity-100">
                    create account
                </button>
            </form>
            
            <!-- Small text to toggle state between sign up and sign in -->
            <div class="mt-6 text-center">
                <p id="toggle-text" class="text-sm font-semibold text-gray-700 hover:text-black cursor-pointer underline-offset-4 hover:underline transition-colors p-2 state-transition opacity-100">
                    already have an account, sign in !
                </p>
            </div>
            
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State variable tracking if the form is currently in "Sign Up" mode
            let isSignUpMode = true;

            // DOM Elements
            const mainHeading = document.getElementById('main-heading');
            const authForm = document.getElementById('auth-form');
            const submitBtn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const errorMessage = document.getElementById('error-message');

            // Elements to apply fade transition to
            const transitionElements = [mainHeading, submitBtn, toggleText];

            // Helper function to hide or display the error banner
            function showError(msg) {
                if (msg) {
                    errorMessage.textContent = msg;
                    errorMessage.classList.remove('hidden');
                } else {
                    errorMessage.textContent = '';
                    errorMessage.classList.add('hidden');
                }
            }

            // Toggle function handles the fade transition and content/action updates
            toggleText.addEventListener('click', () => {
                showError(''); // Clear error messages when toggling mode

                // 1. Fade out specific text elements
                transitionElements.forEach(el => {
                    el.classList.remove('opacity-100');
                    el.classList.add('opacity-0');
                });

                // 2. Wait for the CSS transition to complete (300ms matches CSS transition)
                setTimeout(() => {
                    // Update state
                    isSignUpMode = !isSignUpMode;

                    // Update UI elements based on state
                    if (isSignUpMode) {
                        mainHeading.textContent = 'SIGN UP';
                        submitBtn.textContent = 'create account';
                        toggleText.textContent = 'already have an account, sign in !';
                    } else {
                        mainHeading.textContent = 'SIGN IN';
                        submitBtn.textContent = 'login';
                        toggleText.textContent = 'dont have an account, sign up ! ';
                    }

                    // 3. Fade in specific text elements with updated content
                    transitionElements.forEach(el => {
                        el.classList.remove('opacity-0');
                        el.classList.add('opacity-100');
                    });
                }, 300); 
            });
            
            // Handle form submission to connect with database API
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                showError(''); // Reset error banner on new submit attempt

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Use relative paths to connect to the active server domain
                const endpoint = isSignUpMode ? `/api/signup` : `/api/signin`;

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Store the logged-in email in local storage for the home page profile
                        localStorage.setItem('userEmail', email);
                        // Redirect user directly to home_page.html
                        window.location.href = 'home_page.html';
                    } else {
                        // Display error returned by server or database check
                        showError(data.message || 'Invalid email or password.');
                    }
                } catch (error) {
                    console.error('Error during authentication:', error);
                    showError('Cannot connect to server. Ensure "node server.js" is running in terminal.');
                }
            });
        });
    </script>
</body>
</html>
