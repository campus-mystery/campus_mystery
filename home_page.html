        async function loadFeedData() {
            if (isSupabaseConfigured && supabaseClient) {
                try {
                    const { data: cards, error: cardsError } = await supabaseClient
                        .from('cards')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (cardsError) throw cardsError;

                    const { data: comments, error: commentsError } = await supabaseClient

                        .select('*')
                        .order('created_at', { ascending: true });

                    if (!commentsError && comments) {
                        cards.forEach(card => {
                            card.comments = comments.filter(c => c.card_id === card.id).map(c => ({
                                id: c.id,
                                user: c.author || 'Anonymous',
                                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${c.author || c.id}`,
                                text: c.content,
                                timestamp: new Date(c.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            }));
                        });
                    } else {
                        cards.forEach(c => c.comments = c.comments || []);
                    }

                    dbFeed = cards.map(c => ({
                        id: c.id,
                        title: c.title,
                        category: c.category || 'General',
                        description: c.description || c.question_text || '',
                        image: c.image || c.image_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80',
                        options: Array.isArray(c.options) ? c.options : (typeof c.options === 'string' ? JSON.parse(c.options) : []),
                        comments: c.comments || []
                    }));

                } catch (err) {
                    console.error('Supabase fetch failed, using fallback:', err);
                    dbFeed = [...MOCK_DATABASE];
                }
            } else {
                dbFeed = [...MOCK_DATABASE];
            }

            renderFeed();
        }

        function createCardElement(item) {
            const card = document.createElement('article');
            card.className = "bg-white dark:bg-brand-darkCard border border-zinc-200 dark:border-brand-darkBorder rounded-2xl overflow-hidden shadow-sm flex flex-col";
            card.dataset.id = item.id;

            const selectedOption = userSelections[item.id];

            const formattedOptions = item.options.map((opt, idx) => {
                if (typeof opt === 'string') {
                    const id = String.fromCharCode(97 + idx); 
                    return { id, label: opt };
                }
                return opt;
            });

            card.innerHTML = `
                <div class="relative w-full h-36 sm:h-44 bg-zinc-100 dark:bg-zinc-800 overflow-hidden group">
                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover object-center" onerror="this.onerror=null; this.src='https://placehold.co/800x450/18181b/ffffff?text=Image+Unavailable';">
                    <span class="absolute top-3 right-3 bg-black/80 dark:bg-white/80 text-white dark:text-black text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded-lg">
                        ${item.category}
                    </span>
                </div>

                <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between space-y-4">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-black dark:text-white leading-snug">
                            ${item.title}
                        </h2>
                        <p class="mt-1.5 text-xs sm:text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed">
                            ${item.description}
                        </p>
                    </div>

                    <div class="space-y-2 pt-1">
                        <p class="text-[11px] font-semibold text-zinc-400 dark:text-zinc-500 uppercase tracking-wider mb-2">Select Answer / Option:</p>
                        <div class="grid grid-cols-1 gap-2">
                            ${formattedOptions.map(opt => {
                                const isSelected = selectedOption === opt.id;
                                const buttonStyle = isSelected 
                                    ? "bg-black text-white dark:bg-white dark:text-black border-black dark:border-white font-semibold" 
                                    : "bg-zinc-50 dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-800 dark:text-zinc-200 hover:border-zinc-400 dark:hover:border-zinc-600";
                                return `
                                    <button onclick="handleOptionSelect('${item.id}', '${opt.id}')" 
                                        class="w-full text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition flex items-center justify-between group ${buttonStyle}">
                                        <span class="flex items-center gap-2">
                                            <span class="w-5 h-5 rounded-full border border-current flex items-center justify-center text-[10px] font-bold">
                                                ${opt.id.toUpperCase()}
                                            </span>
                                            ${opt.label}
                                        </span>
                                        ${isSelected ? '<i class="fa-solid fa-circle-check text-sm"></i>' : '<i class="fa-regular fa-circle text-zinc-400 text-sm"></i>'}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800 flex items-center justify-between">
                        <button onclick="toggleComments('${item.id}')" class="text-xs font-medium text-zinc-500 dark:text-zinc-400 hover:text-black dark:hover:text-white transition flex items-center gap-1.5 py-1 px-2 -ml-2 rounded-lg">
                            <i class="fa-regular fa-comment text-sm"></i>
                            <span id="comment-count-${item.id}">${item.comments.length} Comments</span>
                            <i id="comment-arrow-${item.id}" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200 ml-0.5"></i>
                        </button>
                        <button onclick="shareCard('${item.title}')" class="p-1.5 text-zinc-400 hover:text-black dark:hover:text-white transition" title="Share">
                            <i class="fa-regular fa-share-from-square text-sm"></i>
                        </button>
                    </div>

                    <div id="comments-section-${item.id}" class="hidden pt-2 space-y-3">
                        <div id="comments-list-${item.id}" class="space-y-2.5 max-h-48 overflow-y-auto pr-1">
                            ${item.comments.length === 0 ? '<p class="text-xs text-zinc-400 italic py-1">No comments yet.</p>' : ''}
                            ${item.comments.map(c => `
                                <div class="flex items-start space-x-2.5 bg-zinc-50 dark:bg-zinc-900 p-2.5 rounded-xl border border-zinc-100 dark:border-zinc-800">
                                    <img src="${c.avatar}" class="w-6 h-6 rounded-full bg-zinc-200 dark:bg-zinc-800 mt-0.5" alt="avatar">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-black dark:text-white">${c.user}</span>
                                            <span class="text-[10px] text-zinc-400">${c.timestamp}</span>
                                        </div>
                                        <p class="text-xs text-zinc-600 dark:text-zinc-300 mt-0.5 leading-relaxed">${c.text}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <form onsubmit="handleAddComment(event, '${item.id}')" class="flex gap-2 pt-1">
                            <input type="text" id="comment-input-${item.id}" placeholder="Write a comment..." required
                                class="flex-1 bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl px-3 py-1.5 text-xs text-black dark:text-white focus:outline-none focus:ring-1 focus:ring-black dark:focus:ring-white transition">
                            <button type="submit" class="bg-black text-white dark:bg-white dark:text-black text-xs font-medium px-3 py-1.5 rounded-xl transition shadow-sm flex items-center justify-center">
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
            return card;
        }

        function renderFeed() {
            const container = document.getElementById('cards-container');
            const searchContainer = document.getElementById('search-results-container');
            
            container.innerHTML = '';
            searchContainer.innerHTML = '';

            const filteredData = dbFeed.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     item.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filteredData.length === 0) {
                const emptyState = `
                    <div class="bg-white dark:bg-brand-darkCard rounded-2xl p-8 text-center border border-zinc-200 dark:border-brand-darkBorder">
                        <i class="fa-solid fa-inbox text-2xl text-zinc-400 mb-2"></i>
                        <h3 class="text-sm font-bold text-black dark:text-white">No matching items found</h3>
                        <p class="text-xs text-zinc-400 mt-1">Try adjusting search parameters.</p>
                    </div>
                `;
                container.innerHTML = emptyState;
                searchContainer.innerHTML = emptyState;
                return;
            }

            filteredData.forEach(item => {
                container.appendChild(createCardElement(item));
                searchContainer.appendChild(createCardElement(item));
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-view').forEach(view => view.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.classList.remove('text-black', 'dark:text-white');
                btn.classList.add('text-zinc-400');
            });

            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-zinc-400');
                activeBtn.classList.add('text-black', 'dark:text-white');
            }
        }

        function handleOptionSelect(cardId, optionId) {
            userSelections[cardId] = optionId;
            renderFeed();
        }

        function toggleComments(cardId) {
            const section = document.getElementById(`comments-section-${cardId}`);
            const arrow = document.getElementById(`comment-arrow-${cardId}`);
            if (section.classList.contains('hidden')) {
                section.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                section.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        async function handleAddComment(event, cardId) {
            event.preventDefault();
            const input = document.getElementById(`comment-input-${cardId}`);
            const text = input.value.trim();
            if (!text) return;

            const userEmail = localStorage.getItem('userEmail') || 'Guest';
            // Get dynamically saved username or default to email prefix
            const currentUsername = localStorage.getItem('currentUsername') || (userEmail !== 'Guest' ? userEmail.split('@')[0] : 'Guest');

            const newComment = {
                id: Date.now(),
                user: currentUsername,
                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentUsername}`,
                text: text,
                timestamp: "Just now"
            };

            if (isSupabaseConfigured && supabaseClient) {
                try {
                    await supabaseClient
                        .from('comments')
                        .insert([{ card_id: cardId, author: currentUsername, content: text, used_id: userEmail }]);
                } catch (err) {
                    console.warn('Could not post comment to Supabase:', err);
                }
            }

            const item = dbFeed.find(i => String(i.id) === String(cardId));
            if (item) {
                item.comments.push(newComment);
                renderFeed();
                toggleComments(cardId);
            }
            input.value = '';
            showToast("Comment added!");
        }

        function shareCard(title) {
            if (navigator.share) {
                navigator.share({ title: title, url: window.location.href }).catch(() => {});
            } else {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast("Link copied!");
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-20 left-1/2 -translate-x-1/2 bg-black text-white dark:bg-white dark:text-black text-xs px-4 py-2 rounded-full shadow-lg z-50 transition-opacity duration-300";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function openModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('create-card-form').reset();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const title = document.getElementById('modal-title').value.trim();
            const category = document.getElementById('modal-category').value;
            const image = document.getElementById('modal-image').value.trim() || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80';
            const description = document.getElementById('modal-description').value.trim();

            const optA = document.getElementById('modal-option-a').value.trim();
            const optB = document.getElementById('modal-option-b').value.trim();
            const optC = document.getElementById('modal-option-c').value.trim();
            const optD = document.getElementById('modal-option-d').value.trim();

            const optionsList = [
                { id: 'a', label: optA },
                { id: 'b', label: optB }
            ];
            if (optC) optionsList.push({ id: 'c', label: optC });
            if (optD) optionsList.push({ id: 'd', label: optD });

            const submitBtn = document.getElementById('submit-card-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Saving...`;

            const userEmail = localStorage.getItem('userEmail') || 'Guest';

            const newCardRecord = {
                title: title,
                category: category,
                description: description,
                image: image,
                options: optionsList,
                used_id: userEmail
            };

            if (isSupabaseConfigured && supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('cards')
                        .insert([newCardRecord]);

                    if (error) throw error;

                    showToast("Published to Supabase!");
                    closeModal();
                    await loadFeedData();
                } catch (err) {
                    console.error('Error inserting card to Supabase:', err);
                    showToast("Failed to save to Supabase.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span>Save & Publish</span>`;
                }
            } else {
                dbFeed.unshift({
                    id: Date.now(),
                    ...newCardRecord,
                    comments: []
                });
                renderFeed();
                showToast("Card saved to mock feed!");
                closeModal();
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span>Save & Publish</span>`;
            }
        }

        // ==========================================
        // USER PROFILE ACTIVITY (Posts & Comments)
        // ==========================================
        async function loadUserActivity() {
            const userEmail = localStorage.getItem('userEmail');
            const postsList = document.getElementById('your-posts-list');
            const commentsList = document.getElementById('your-comments-list');

            if (!userEmail) {
                postsList.innerHTML = '<p class="italic text-zinc-500 py-1">Please log in to see your posts.</p>';
                commentsList.innerHTML = '<p class="italic text-zinc-500 py-1">Please log in to see your comments.</p>';
                return;
            }

            if (isSupabaseConfigured && supabaseClient) {
                try {
                    // Fetch user's posts using 'used_id'
                    const { data: userPosts, error: postsError } = await supabaseClient
                        .from('cards')
                        .select('title, category')
                        .eq('used_id', userEmail)
                        .order('created_at', { ascending: false });

                    if (!postsError && userPosts) {
                        postsList.innerHTML = userPosts.length > 0 ? userPosts.map(p => 
                            `<div class="p-2.5 bg-zinc-50 dark:bg-zinc-900 rounded-lg border border-zinc-200 dark:border-zinc-700">
                                <p class="font-semibold text-black dark:text-white truncate text-xs">${p.title}</p>
                                <p class="text-[10px] mt-1 text-zinc-500 font-medium uppercase tracking-wider">${p.category}</p>
                            </div>`
                        ).join('') : '<p class="text-zinc-400 py-1">No posts yet.</p>';
                    }

                    // Fetch user's comments using 'used_id' (Removed failing cards(title) join to prevent silent errors)
                    const { data: userComments, error: commentsError } = await supabaseClient
                        .from('comments')
                        .select('content, card_id')
                        .eq('used_id', userEmail)
                        .order('created_at', { ascending: false });

                    if (!commentsError && userComments) {
                        commentsList.innerHTML = userComments.length > 0 ? userComments.map(c => {
                            // Match card title locally instead of relying on Supabase joins that might lack foreign keys
                            const matchedCard = dbFeed.find(card => String(card.id) === String(c.card_id));
                            const postTitle = matchedCard ? matchedCard.title : 'Unknown Post';
                            
                            return `<div class="p-2.5 bg-zinc-50 dark:bg-zinc-900 rounded-lg border border-zinc-200 dark:border-zinc-700">
                                <p class="text-xs text-black dark:text-white font-medium">"${c.content}"</p>
                                <p class="text-[10px] mt-1 text-zinc-500 truncate">On: ${postTitle}</p>
                            </div>`;
                        }).join('') : '<p class="text-zinc-400 py-1">No comments yet.</p>';
                    } else if (commentsError) {
                        console.error('Error fetching comments:', commentsError);
                    }
                } catch (err) {
                    console.error('Error fetching user activity:', err);
                }
            } else {
                postsList.innerHTML = '<p class="text-zinc-400 py-1">No posts available in offline mode.</p>';
                commentsList.innerHTML = '<p class="text-zinc-400 py-1">No comments available in offline mode.</p>';
            }
        }

        // ==========================================
        // USER PROFILE, USERNAME & THEME MANAGEMENT
        // ==========================================
        async function initUserProfileAndTheme() {
            const userEmail = localStorage.getItem('userEmail');
            const emailDisplay = document.getElementById('profile-email-display');
            const usernameDisplay = document.getElementById('profile-username-display');
            const usernameInput = document.getElementById('username-input');
            const themeToggle = document.getElementById('theme-toggle');
            
            let currentUsername = userEmail ? userEmail.split('@')[0] : "Guest User";

            if (userEmail) {
                emailDisplay.textContent = userEmail;
            } else {
                emailDisplay.textContent = "Guest User";
            }

            if (isSupabaseConfigured && supabaseClient && userEmail) {
                try {
                    // Fetch existing username & theme preference from logins table
                    const { data, error } = await supabaseClient
                        .from('logins')
                        .select('username, theme')
                        .eq('email', userEmail)
                        .maybeSingle();

                    if (!error && data) {
                        if (data.username) {
                            currentUsername = data.username;
                            usernameDisplay.textContent = data.username;
                            usernameInput.value = data.username;
                        } else {
                            usernameDisplay.textContent = currentUsername;
                        }

                        if (data.theme !== null) {
                            const isDark = Boolean(data.theme);
                            themeToggle.checked = isDark;
                            if (isDark) {
                                document.documentElement.classList.add('dark');
                            } else {
                                document.documentElement.classList.remove('dark');
                            }
                        }
                    } else {
                        usernameDisplay.textContent = currentUsername;
                    }
                } catch (err) {
                    console.warn('Could not fetch user profile data:', err);
                    usernameDisplay.textContent = currentUsername;
                }
            } else {
                usernameDisplay.textContent = currentUsername;
            }
            
            // Save initial valid username to localStorage to use dynamically for new comments
            localStorage.setItem('currentUsername', currentUsername);

            // Theme Switcher Listener that updates Supabase directly
            themeToggle.addEventListener('change', async (e) => {
                const isDark = e.target.checked;

                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                if (isSupabaseConfigured && supabaseClient && userEmail) {
                    try {
                        const { error } = await supabaseClient
                            .from('logins')
                            .update({ theme: isDark })
                            .eq('email', userEmail);

                        if (error) throw error;
                        showToast("Theme preference saved!");
                    } catch (err) {
                        console.error('Error updating theme in Supabase:', err);
                    }
                }
            });

            // Save Username Handler
            const saveBtn = document.getElementById('save-username-btn');
            saveBtn.addEventListener('click', async () => {
                const newUsername = usernameInput.value.trim();
                if (!newUsername) {
                    showToast("Username cannot be empty");
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Saving...</span>`;

                if (isSupabaseConfigured && supabaseClient && userEmail) {
                    try {
                        const { error } = await supabaseClient
                            .from('logins')
                            .update({ username: newUsername })
                            .eq('email', userEmail);

                        if (error) throw error;

                        usernameDisplay.textContent = newUsername;
                        localStorage.setItem('currentUsername', newUsername);
                        showToast("Username updated!");
                    } catch (err) {
                        console.error('Error updating username in Supabase:', err);
                        showToast("Failed to update username");
                    } finally {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = `<i class="fa-solid fa-check text-xs"></i><span>Save Username</span>`;
                    }
                } else {
                    usernameDisplay.textContent = newUsername;
                    localStorage.setItem('currentUsername', newUsername);
                    showToast("Username updated locally!");
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = `<i class="fa-solid fa-check text-xs"></i><span>Save Username</span>`;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFeedData();
            initUserProfileAndTheme();

            // Toggle Edit Profile accordion in Profile
            const editProfileBtn = document.getElementById('toggle-edit-profile-btn');
            const editProfileContent = document.getElementById('edit-profile-content');
            const editProfileChevron = document.getElementById('edit-profile-chevron');

            editProfileBtn.addEventListener('click', () => {
                const isHidden = editProfileContent.classList.contains('hidden');
                if (isHidden) {
                    editProfileContent.classList.remove('hidden');
                    editProfileChevron.classList.add('rotate-180');
                } else {
                    editProfileContent.classList.add('hidden');
                    editProfileChevron.classList.remove('rotate-180');
                }
            });

            // Toggle Your Posts accordion in Profile
            const yourPostsBtn = document.getElementById('toggle-your-posts-btn');
            const yourPostsContent = document.getElementById('your-posts-content');
            const yourPostsChevron = document.getElementById('your-posts-chevron');

            yourPostsBtn.addEventListener('click', () => {
                const isHidden = yourPostsContent.classList.contains('hidden');
                if (isHidden) {
                    yourPostsContent.classList.remove('hidden');
                    yourPostsChevron.classList.add('rotate-180');
                    loadUserActivity(); // Fetch recent items
                } else {
                    yourPostsContent.classList.add('hidden');
                    yourPostsChevron.classList.remove('rotate-180');
                }
            });

            // Toggle Your Comments accordion in Profile
            const yourCommentsBtn = document.getElementById('toggle-your-comments-btn');
            const yourCommentsContent = document.getElementById('your-comments-content');
            const yourCommentsChevron = document.getElementById('your-comments-chevron');

            yourCommentsBtn.addEventListener('click', () => {
                const isHidden = yourCommentsContent.classList.contains('hidden');
                if (isHidden) {
                    yourCommentsContent.classList.remove('hidden');
                    yourCommentsChevron.classList.add('rotate-180');
                    loadUserActivity(); // Fetch recent items
                } else {
                    yourCommentsContent.classList.add('hidden');
                    yourCommentsChevron.classList.remove('rotate-180');
                }
            });

            // Toggle Settings accordion in Profile
            const settingsBtn = document.getElementById('toggle-settings-btn');
            const settingsContent = document.getElementById('settings-content');
            const settingsChevron = document.getElementById('settings-chevron');

            settingsBtn.addEventListener('click', () => {
                const isHidden = settingsContent.classList.contains('hidden');
                if (isHidden) {
                    settingsContent.classList.remove('hidden');
                    settingsChevron.classList.add('rotate-180');
                } else {
                    settingsContent.classList.add('hidden');
                    settingsChevron.classList.remove('rotate-180');
                }
            });

            // Category Filter Buttons
            document.querySelectorAll('.category-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-filter-btn').forEach(b => {
                        b.classList.remove('bg-black', 'text-white', 'dark:bg-white', 'dark:text-black');
                        b.classList.add('bg-white', 'dark:bg-brand-darkCard', 'text-zinc-600', 'dark:text-zinc-300');
                    });

                    e.currentTarget.classList.remove('bg-white', 'dark:bg-brand-darkCard', 'text-zinc-600', 'dark:text-zinc-300');
                    e.currentTarget.classList.add('bg-black', 'text-white', 'dark:bg-white', 'dark:text-black');

                    currentCategory = e.currentTarget.dataset.category;
                    renderFeed();
                });
            });

            // Search Listener
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderFeed();
            });

            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);
            document.getElementById('create-card-form').addEventListener('submit', handleFormSubmit);

            document.getElementById('refresh-feed-btn').addEventListener('click', () => {
                loadFeedData();
                showToast("Feed synced!");
            });

            // Sign Out Listener
            document.getElementById('sign-out-btn').addEventListener('click', () => {
                localStorage.removeItem('userEmail');
                window.location.href = 'login_or_signup_page.html';
            });
        });
    </script>
</body>
